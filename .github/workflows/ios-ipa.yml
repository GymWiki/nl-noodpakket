name: iOS IPA

# Bouwt de gesigneerde .ipa voor de App Store. Starten: Actions > iOS IPA > Run workflow,
# of een tag zoals v1.0.14 pushen. Het bestand staat daarna onder "Artifacts" (nl-noodpakket-ipa).
# Zie README, "IPA via GitHub", voor de drie secrets die je eenmalig toevoegt.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Buildnummer (leeg = <pubspec-bouwnummer>.<run-nummer>, bijvoorbeeld 14.7). Moet hoger zijn dan wat in App Store Connect staat voor deze versie.'
        required: false
        type: string
      upload_to_testflight:
        description: 'Na het bouwen ook uploaden naar App Store Connect (TestFlight). Vraagt de drie API-secrets.'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  ipa:
    # Apple eist sinds 28 april 2026 Xcode 26 of nieuwer voor uploads (developer.apple.com/news/upcoming-requirements,
    # gecontroleerd op 2026-11-16). Het image macos-26 heeft Xcode 26.x (standaard 26.6).
    # TODO (uiterlijk april 2027): Apple eist dan Xcode 27 of nieuwer (iOS 27 SDK) voor uploads; altool geeft hier al een
    # waarschuwing over (SDK 26.5). Controleer de runner-images (github.com/actions/runner-images), kies een image met
    # Xcode 27 en pas runs-on en de stap "Xcode kiezen" (Xcode_26*) hieronder aan. Nu bewust niet aangepast.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.mycompany.mijnnoodpakket
    steps:
      - uses: actions/checkout@v4

      - name: Xcode kiezen (26 of nieuwer)
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::Geen Xcode 26 op deze runner. Zet runs-on op een image met Xcode 26 of nieuwer."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Voorcontrole (deployment target, gebruiksteksten, icoon, privacymanifest)
        run: |
          set -euo pipefail
          python3 tool/test_ios_scripts.py
          dart run tool/ios_preflight.dart

      - name: Signing-secrets decoderen en certificaat importeren
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          missing=""
          if [ -z "$CERT_P12_BASE64" ]; then missing="$missing IOS_CERTIFICATE_P12_BASE64"; fi
          if [ -z "$CERT_PASSWORD" ]; then missing="$missing IOS_CERTIFICATE_PASSWORD"; fi
          if [ -z "$PROFILE_BASE64" ]; then missing="$missing IOS_PROVISIONING_PROFILE_BASE64"; fi
          if [ -n "$missing" ]; then
            echo "::error::Deze secrets ontbreken of zijn leeg:$missing (zie README, IPA via GitHub)."
            exit 1
          fi

          # Alleen naar $RUNNER_TEMP, nooit naar de workspace.
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 is geen geldige base64 (of is leeg na decoderen)."
            exit 1
          fi
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/profile.mobileprovision" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is geen geldige base64 (of is leeg na decoderen)."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

          # Tijdelijke keychain met een willekeurig wachtwoord.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>&1; then
            echo "::error::De .p12 kon niet worden geïmporteerd: onjuist wachtwoord (IOS_CERTIFICATE_PASSWORD) of een ongeldig bestand."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/identities.txt"

          # Het profile uitlezen (naam, UUID, team, verloop, certificaten).
          if ! security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" -o "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::Het provisioning profile is geen geldig .mobileprovision-bestand."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Profile en certificaat valideren
        run: |
          set -euo pipefail
          python3 tool/ios_profile_check.py "$RUNNER_TEMP/profile.plist" "$BUNDLE_ID" "$RUNNER_TEMP/identities.txt" --env-out "$GITHUB_ENV"

      - name: Profile installeren
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Release op handmatige ondertekening zetten (alleen in deze build)
        run: |
          set -euo pipefail
          python3 tool/ios_signing_patch.py "$TEAM_ID" "$PROFILE_NAME"

      - name: Versie en bouwnummer bepalen
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)
          PUBSPEC_BUILD=$(sed -n 's/^version: [0-9][0-9.]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          if [ -z "$VERSION_NAME" ] || [ -z "$PUBSPEC_BUILD" ]; then
            echo "::error::Kon de versie niet lezen uit pubspec.yaml (verwacht 'version: X.Y.Z+N')."
            exit 1
          fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            # Elke run hoger dan de vorige: pubspec-bouwnummer, punt, runnummer (bijv. 14.7).
            BUILD_NUMBER="$PUBSPEC_BUILD.$RUN_NUMBER"
          fi
          if ! echo "$BUILD_NUMBER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Ongeldig bouwnummer '$BUILD_NUMBER' (toegestaan: tot drie getallen gescheiden door punten)."
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Versie $VERSION_NAME, bouwnummer $BUILD_NUMBER"

      - name: ExportOptions.plist maken
        run: |
          set -euo pipefail
          python3 tool/ios_export_options.py "$TEAM_ID" "$BUNDLE_ID" "$PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"

      - name: IPA bouwen
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/ios/ipa

      - name: IPA controleren (ondertekening, bundle-id, team, versie, minimale iOS)
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          python3 tool/ios_ipa_verify.py "$IPA" "$BUNDLE_ID" "$TEAM_ID" "$VERSION_NAME" "$BUILD_NUMBER" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nl-noodpakket-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Uploaden naar App Store Connect (TestFlight)
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "::error::Zet APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID en APP_STORE_CONNECT_API_KEY_BASE64 (zie README)."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          # Eerst valideren (geeft duidelijkere fouten), dan uploaden. altool staat nog als uploadmethode in
          # Apples documentatie (developer.apple.com/help/app-store-connect/manage-builds/upload-builds).
          xcrun altool --validate-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "### Geupload naar App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Versie $VERSION_NAME, bouwnummer $BUILD_NUMBER. De build verschijnt na verwerking (meestal 5 tot 30 minuten) onder TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Opruimen (keychain, profile, gedecodeerde bestanden)
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/identities.txt" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
