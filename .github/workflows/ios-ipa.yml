name: iOS IPA

# Bouwt de gesigneerde .ipa voor de App Store. Starten: Actions > iOS IPA > Run workflow,
# of een tag zoals v1.0.13 pushen. Het bestand staat daarna onder "Artifacts" (nl-noodpakket-ipa).
# Zie README, "IPA via GitHub", voor de drie secrets die je eenmalig toevoegt.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Buildnummer (leeg = zoals in pubspec.yaml). Moet hoger zijn dan wat in App Store Connect staat.'
        required: false
        type: string
      upload_to_testflight:
        description: 'Na het bouwen ook uploaden naar App Store Connect (TestFlight). Vraagt de drie API-secrets.'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  ipa:
    # Apple eist uploads gebouwd met Xcode 26 of nieuwer. Bestaat dit image (nog) niet, zet dan macos-15
    # of het nieuwste macos-image en kies de juiste Xcode met de stap "Xcode kiezen".
    runs-on: macos-26
    env:
      BUNDLE_ID: com.mycompany.mijnnoodpakket
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Xcode kiezen
        run: |
          xcodebuild -version
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)" 2>/dev/null || true
          xcodebuild -version

      - name: Signing klaarzetten
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Zet de secrets IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD en IOS_PROVISIONING_PROFILE_BASE64 (zie README)."
            exit 1
          fi

          # Tijdelijke keychain, alleen voor deze build.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Provisioning profile installeren en naam, UUID en team uitlezen.
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Het provisioning profile is voor '$APP_ID', maar de app is $BUNDLE_ID."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Xcode-project op handmatig signing zetten (alleen in deze build)
        run: |
          python3 - <<'PY'
          import os, re
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          # Release-configuratie van het target Runner (id uit het project).
          m = re.search(r'(97C147071CF9000F007C117D /\* Release \*/ = \{.*?buildSettings = \{)(.*?)(\n\t\t\t\};)', s, re.S)
          assert m, 'Release-configuratie van Runner niet gevonden'
          body = m.group(2)
          body = re.sub(r'\n\t\t\t\t(CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|"?CODE_SIGN_IDENTITY(\[sdk=iphoneos\*\])?"?) = [^;]*;', '', body)
          add = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                 '\n\t\t\t\tDEVELOPMENT_TEAM = %s;'
                 '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";'
                 '\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";') % (os.environ['TEAM_ID'], os.environ['PROFILE_NAME'])
          s = s[:m.start(2)] + body + add + s[m.end(2):]
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: ExportOptions.plist maken
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - run: flutter pub get

      - name: IPA bouwen
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=(--release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist")
          if [ -n "$BUILD_NUMBER" ]; then ARGS+=(--build-number="$BUILD_NUMBER"); fi
          flutter build ipa "${ARGS[@]}"
          ls -la build/ios/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: nl-noodpakket-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Uploaden naar App Store Connect (TestFlight)
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "::error::Zet APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID en APP_STORE_CONNECT_API_KEY_BASE64 (zie README)."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Opruimen
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
