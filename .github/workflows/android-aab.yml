name: Android AAB

# Handmatig starten (Actions > Android AAB > Run workflow) of automatisch bij een tag zoals v2.0.1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Voorcontrole versie (hoger dan de laatst vrijgegeven versie)
        run: |
          set -euo pipefail
          python3 tool/test_version_check.py
          python3 tool/check_version.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Upload-sleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Zet de vier secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS en ANDROID_KEY_PASSWORD (zie README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      # versionCode = 100 + run-nummer van de workflow: altijd hoger dan 21 (de afgewezen release) en bij elke run hoger dan de vorige.
      # Google Play eist een uniek, stijgend versionCode per upload. De pubspec-versie (+21) wordt hiermee bewust overschreven; iOS blijft ongemoeid.
      - name: versionCode bepalen
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "versionCode wordt $((100 + GITHUB_RUN_NUMBER))"
      - run: flutter build appbundle --release --build-number="$VERSION_CODE"

      # Google Play filtert toestellen op verplichte hardware-features, ook die het zelf afleidt uit machtigingen en
      # activity-instellingen (CAMERA -> camera en autofocus, ACCESS_WIFI_STATE -> wifi, screenOrientation=portrait ->
      # screen.portrait). Daarom bouwen we een universele APK en lezen we met aapt2 welke features verplicht zijn.
      - name: Universele APK bouwen (alleen voor de functiecontrole; wordt niet bewaard)
        run: flutter build apk --release --build-number="$VERSION_CODE"

      - name: Verplichte hardware-features controleren (alleen touchscreen is toegestaan)
        run: |
          set -euo pipefail
          python3 tool/test_android_features.py
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=$(ls -d "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "aapt2: $AAPT2"
          mkdir -p build/android-features
          "$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk > build/android-features/badging.txt
          grep -E "^(package|uses-feature|uses-implied-feature|uses-permission|uses-implied-permission)" build/android-features/badging.txt || true
          MERGED=$(find build/app -path '*merged_manifests*' -path '*elease*' -name AndroidManifest.xml | head -1 || true)
          [ -n "$MERGED" ] && cp "$MERGED" build/android-features/merged-AndroidManifest.xml || true
          REPORT=$(find build/app -name 'manifest-merger-release-report.txt' | head -1 || true)
          [ -n "$REPORT" ] && cp "$REPORT" build/android-features/ || true
          python3 tool/android_features_check.py build/android-features/badging.txt

      - name: Rapport van de features bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-features-rapport
          path: build/android-features
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: nl-noodpakket-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Sleutel opruimen
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
